<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCB Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

    <style>
      body {
        background-color: #e9ecef;
      }
      
      /* NAVBAR */
      .navbar {
        height: 60px;
        z-index: 1000;
      }
      
      /* SIDEBAR */
      .sidebar {
        position: fixed;
        top: 60px;
        bottom: 0;
        left: 0;
        width: 240px;
        background-color: #1e1b4b;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 15px;
      }
      
      /* MENU */
      .menu a {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #cbd5f5;
        padding: 10px;
        border-radius: 10px;
        text-decoration: none;
        margin-bottom: 5px;
        transition: 0.2s;
      }
      
      .menu a:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }
      
      .menu a.active {
        background-color: #9ca3af;
        color: black;
      }
      
      /* LOGO */
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        font-weight: bold;
      }
      
      .logo i {
        background: limegreen;
        padding: 8px;
        border-radius: 5px;
        color: black;
      }
      
      /* FOOTER USER */
      .sidebar-footer {
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        padding-top: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      
      .sidebar-footer img {
        width: 35px;
        border-radius: 50%;
      }
      
      .user-info {
        font-size: 12px;
      }
      
      /* MAIN */
      main {
        margin-left: 240px;
        margin-top: 60px;
        padding: 20px;
      }
      
      /* RESPONSIVE */
      @media (max-width: 991px) {
        .sidebar {
          left: -240px;
          transition: 0.3s;
        }
      
        .sidebar.show {
          left: 0;
        }
      
        main {
          margin-left: 0;
        }
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white fixed-top shadow-sm">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>

        <a class="navbar-brand" href="#">My Dashboard</a>
      </div>
    </nav>

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">
      <!-- TOP -->
      <div>
        <div class="logo">
          <i class="fas fa-microchip"></i>
          <span>
            PCB Defect<br />
            Detection
          </span>
        </div>

        <div class="menu">
          <a href="{{ url_for('admin_dashboard') }}"> <i class="fas fa-chart-line"></i>Dashboard</a>

          <a href="{{ url_for('admin_manage_user') }}" class="active"><i class="fas fa-user"></i>Manage User</a>

          <a href="{{ url_for('admin_report') }}"><i class="fas fa-file-alt"></i>Report</a>
        </div>
      </div>

      <!-- USER -->
      <div class="sidebar-footer">
        <div class="dropdown">
          <a href="#" data-bs-toggle="dropdown"><img src="https://mdbcdn.b-cdn.net/img/Photos/Avatars/img (31).webp" /></a>

          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item" href="#">Settings</a>
            </li>
            <li>
              <a class="dropdown-item" href="/logout">Logout</a>
            </li>
          </ul>
        </div>

        <div class="user-info">
          <div>{{ username }}</div>
          <div style="color: #9ca3af;">{{ role }}</div>
        </div>
      </div>
    </div>

    <!-- MAIN -->

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('show')
      }
    </script>
  </body>
</html>
