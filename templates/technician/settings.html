<!DOCTYPE html>
<html lang="{{ language }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ _("Settings") }}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='workspace.css') }}">
  <script src="{{ url_for('static', filename='workspace.js') }}" defer></script>
{% include 'shared/i18n.html' %}
</head>

<body class="settings-page view-technician-settings">

<nav class="navbar bg-white fixed-top shadow-sm">
  <div class="container-fluid">
    <a href="{{ url_for('technician_dashboard') }}" class="btn btn-link text-decoration-none">
      <span aria-hidden="true">←</span> {{ _("Back to workspace") }}
    </a>
  </div>
{% include 'shared/language_switch.html' %}</nav>

<main>
  <div class="settings-wrapper">
    <div class="settings-card">
      <div class="card-body">
        <div class="mb-4">
          <h4 class="fw-semibold">{{ _("Change password") }}</h4>
          <p class="text-muted mb-0">{{ _("Please change your account password securely.") }}</p>
        </div>

        {% if error %}
          <div class="alert alert-danger">{{ _(error) }}</div>
        {% endif %}

        <form action="/change-password" method="POST" onsubmit="return validatePassword()">
          <div class="mb-3">
            <label for="oldPass" class="form-label">{{ _("Old Password") }}</label>
            <input type="password" id="oldPass" name="old_password" autocomplete="current-password" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="newPass" class="form-label">{{ _("New Password") }}</label>
            <input type="password" id="newPass" name="new_password" autocomplete="new-password" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="confirmPass" class="form-label">{{ _("Confirm Password") }}</label>
            <input type="password" id="confirmPass" autocomplete="new-password" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">{{ _("Save Password") }}</button>
        </form>
      </div>
    </div>
  </div>
</main>

<script>
function validatePassword() {
  const newPass = document.getElementById('newPass').value
  const confirmPass = document.getElementById('confirmPass').value

  if (newPass.length < 6) {
    alert(t('Password must be at least 6 characters!'))
    return false
  }

  const hasLetters = /[a-zA-Z]/.test(newPass)
  const hasNumbers = /[0-9]/.test(newPass)

  if (!hasLetters || !hasNumbers) {
    alert(t('Password must contain letters and numbers!'))
    return false
  }

  if (newPass !== confirmPass) {
    alert(t('Password confirmation does not match!'))
    return false
  }

  return true
}
</script>

</body>
</html>
