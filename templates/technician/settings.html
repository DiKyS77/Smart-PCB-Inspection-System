<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body {
      background: #eef3fb;
      min-height: 100vh;
    }

    main {
      margin: 0;
      padding: 88px 30px 40px;
      min-height: 100vh;
    }

    .settings-wrapper {
      max-width: 760px;
      margin: 0 auto;
      padding: 30px 0;
    }

    .settings-card {
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      background: #ffffff;
    }

    .settings-card .card-body {
      padding: 36px;
    }

    .settings-card label {
      font-weight: 600;
    }

    .settings-card .form-control {
      border-radius: 12px;
      border: 1px solid #d1d5db;
      box-shadow: none;
    }

    .settings-card .btn-primary {
      border-radius: 12px;
      padding: 12px 18px;
    }

    .settings-card .alert {
      border-radius: 14px;
    }

    @media (max-width: 991px) {
      .sidebar {
        left: -240px;
        transition: 0.3s;
      }

      .sidebar.show {
        left: 0;
      }

      main {
        margin-left: 0;
        padding-top: 20px;
      }
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar bg-white fixed-top shadow-sm">
  <div class="container-fluid">
    <a href="{{ url_for('technician_dashboard') }}" class="btn btn-link text-decoration-none">
      <i class="fas fa-arrow-left"></i> Back
    </a>
  </div>
</nav>

<!-- MAIN -->
<main>
  <div class="settings-wrapper">
    <div class="settings-card">
      <div class="card-body">
        <div class="mb-4">
          <h4 class="fw-bold">Ubah Password</h4>
          <p class="text-muted mb-0">Please change your account password securely.</p>
        </div>

        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form action="/change-password" method="POST" onsubmit="return validatePassword()">
          <div class="mb-3">
            <label class="form-label">Old Password</label>
            <input type="password" name="old_password" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" id="newPass" name="new_password" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="confirmPass" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">Save Password</button>
        </form>
      </div>
    </div>
  </div>
</main>

<script>
function validatePassword() {
  const newPass = document.getElementById('newPass').value
  const confirmPass = document.getElementById('confirmPass').value

  if (newPass.length < 6) {
    alert('Password must be at least 6 characters!')
    return false
  }

  const hasLetters = /[a-zA-Z]/.test(newPass)
  const hasNumbers = /[0-9]/.test(newPass)

  if (!hasLetters || !hasNumbers) {
    alert('Password must contain letters and numbers!')
    return false
  }

  if (newPass !== confirmPass) {
    alert('Password confirmation does not match!')
    return false
  }

  return true
}
</script>

</body>
</html>
